services:
  app:
    build: .
    image: rocketmq-console:latest
    container_name: rocketmq-console
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:////data/app.db
    volumes:
      - rocketmq-data:/data
    ports:
      # 仅本机监听，由 Nginx 反向代理暴露到内网；如需直接访问改成 ECS 内网 IP。
      - "127.0.0.1:8000:8000"

volumes:
  rocketmq-data:
