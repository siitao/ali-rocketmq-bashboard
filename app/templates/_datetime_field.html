{% macro datetime_field(name, label, value, range_role="") %}
<div class="field">
  <span class="field-label" id="{{ name }}-label">{{ label }}</span>
  <div class="datetime" data-datetime-picker>
    <button class="datetime-trigger" type="button" data-datetime-trigger
            aria-haspopup="dialog" aria-expanded="false" aria-labelledby="{{ name }}-label">
      <span class="datetime-text" data-datetime-label>{{ value|replace('T', ' ') or '请选择时间' }}</span>
      <svg class="datetime-icon" width="15" height="15" viewBox="0 0 16 16" aria-hidden="true">
        <rect x="2.5" y="3.5" width="11" height="10" rx="2" fill="none"
              stroke="currentColor" stroke-width="1.3"/>
        <path d="M2.5 6.5h11M5.5 2.5v2M10.5 2.5v2" fill="none"
              stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
      </svg>
    </button>
    <input type="hidden" name="{{ name }}" value="{{ value }}" data-datetime-value
           {% if range_role %}data-range-{{ range_role }}{% endif %}>
    <div class="datetime-popover" role="dialog" aria-label="选择{{ label }}"
         tabindex="-1" data-datetime-popover hidden></div>
  </div>
</div>
{% endmacro %}
